[build-system]
# >=77 for PEP 639 SPDX license metadata (`license = "MIT"` + license-files).
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "GenADCS"
version = "0.3.0"
description = "Generalized Attitude Determination and Control System (ADCS) framework."
authors = [
    { name = "Patrick McKeen", email = "pmckeen@mit.edu" },
    { name = "Niclas Scheuer", email = "nscheuer@ethz.ch" },
    { name = "William Goldman" },
]
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX form. The old `{ text = "MIT" }` table is deprecated and emits
# no License-Expression, which is why the 0.1.5 listing showed no license facet.
license = "MIT"
license-files = ["LICENSE"]

keywords = [
    "ADCS", "attitude control", "attitude determination", "spacecraft",
    "satellite", "cubesat", "smallsat", "aerospace", "GNC", "magnetorquer",
    "reaction wheel", "control allocation", "Kalman filter", "orbit",
]

# Without these the PyPI page carries no facets at all, so the project is
# invisible to searches filtered by Python version, licence, audience or topic.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    # requires-python is >=3.10 and unbounded, but only 3.12 is exercised in
    # CI; 3.13+ is unlisted rather than claimed, since numba tends to lag new
    # Python releases.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]

# Dependencies for the GenADCS Python backend.
dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
    "tqdm>=4.60",
]

# Optional extras
[project.optional-dependencies]
docs = [
    "sphinx>=7.2",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "myst-parser",
    "furo",
    "sphinx-sitemap",
    "sphinx-multiversion",
]

dev = [
    "pytest",
    "pytest-xdist",
    "numdifftools",
    "black",
    "ruff",
    "pyright",
    "pip-audit",
]

[project.urls]
# PyPI renders these as sidebar links and gives several of them dedicated
# icons; only Repository and Documentation were present for 0.1.5.
Homepage = "https://nscheuer.github.io/Generalized_ADCS/"
Documentation = "https://nscheuer.github.io/Generalized_ADCS/"
Repository = "https://github.com/nscheuer/Generalized_ADCS"
Issues = "https://github.com/nscheuer/Generalized_ADCS/issues"
Changelog = "https://github.com/nscheuer/Generalized_ADCS/releases"

[tool.setuptools.packages.find]
include = ["GenADCS", "GenADCS.*"]
exclude = ["GenADCS.tests*", "GenADCS.examples*"]

[tool.setuptools.package-data]
"GenADCS.kernels.environment.ephemeris.de421" = ["de421.bsp"]
"GenADCS.kernels.environment.magnetic_field_model.chaos8" = ["*.shc"]
"GenADCS.kernels.environment.magnetic_field_model.igrf14" = ["*.shc"]

[tool.setuptools.exclude-package-data]
"*" = ["textures/*", "assets/raw/*", "assets/processed/*", "*.jpg", "*.png", "*.exr", "*.tif"]

[tool.pytest.ini_options]
testpaths = ["GenADCS/tests"]
markers = [
    "local: requires locally installed or downloaded tools and is excluded from CI",
]
norecursedirs = [
    ".git",
    ".pytest_cache",
    "venv",
]
addopts = [
    "-m", "not local",
    "-ra",
    "--tb=short",
    "--durations=15",
    "--durations-min=0.1",
]
junit_family = "xunit2"

[tool.pyright]
include = ["GenADCS/backends/python", "GenADCS/tests"]
typeCheckingMode = "strict"
