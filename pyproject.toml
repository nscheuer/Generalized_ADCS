[build-system]
# >=77 for PEP 639 SPDX license metadata (`license = "MIT"` + license-files).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Generalized_ADCS"
# NOTE: this had drifted. docs/source/release_notes/ documents releases through
# 0.1.7 (remote execution, benchmarks) while pyproject still said 0.1.5, so the
# first PyPI upload went out as 0.1.5 -- two behind the documented state, and
# built before the choldate removal. PyPI versions are immutable, so this moves
# forward past the documented 0.1.7 rather than trying to reuse a number.
version = "0.1.8"
description = "Generalized Attitude Determination and Control System (ADCS) framework."
authors = [
    { name = "Patrick McKeen", email = "pmckeen@mit.edu" },
    { name = "Niclas Scheuer", email = "nscheuer@ethz.ch" },
    { name = "William Goldman" },
]
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX form. The old `{ text = "MIT" }` table is deprecated and emits
# no License-Expression, which is why the 0.1.5 listing showed no license facet.
license = "MIT"
license-files = ["LICENSE"]

keywords = [
    "ADCS", "attitude control", "attitude determination", "spacecraft",
    "satellite", "cubesat", "smallsat", "aerospace", "GNC", "magnetorquer",
    "reaction wheel", "control allocation", "Kalman filter", "orbit",
]

# Without these the PyPI page carries no facets at all, so the project is
# invisible to searches filtered by Python version, licence, audience or topic.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    # requires-python is >=3.10 and unbounded, but only 3.12 is exercised in
    # CI; 3.13+ is unlisted rather than claimed, since numba tends to lag new
    # Python releases.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]

# Runtime dependencies.
#
# This list is exactly what ``import ADCS`` needs, with compatible ranges
# rather than exact pins so the package can be installed into an existing
# environment. Transitive dependencies (matplotlib's contourpy/pillow/...,
# skyfield's sgp4/jplephem/certifi, ...) are resolved by pip and are
# deliberately NOT restated here.
#
# For bit-reproducible paper campaigns use the exact pins instead:
#     pip install -r requirements-repro.txt
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "numba>=0.59",
    "ppigrf>=2.0",
    "skyfield>=1.45",
    "tqdm>=4.60",
    "rich>=13.0",
]

# Optional extras
[project.optional-dependencies]
# 3-D orbit animation helpers (ADCS/helpers/plotting/animate_orbit_pyvista.py).
viz = [
    "pyvista>=0.44",
]

# Build toolchain for the optional C++ add-ons (SALTRO, trajectory planner).
#
# SOURCE CHECKOUT ONLY. This installs the compilers/bindings, but the add-ons
# themselves live in the SALTRO and OldPlanner git submodules, which are NOT
# part of the distribution -- so `pip install "generalized-adcs[cpp]"` gives a
# pip user the toolchain and nothing to build with it. Useful only alongside a
# clone of the repository. Neither add-on is needed for the pure-Python
# framework; both are guarded optional imports.
cpp = [
    "cmake>=3.27",
    "Cython>=3.0",
    "pybind11>=2.12",
]

docs = [
    "sphinx>=7.2",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "myst-parser",
    "furo",
    "sphinx-sitemap",
]

poster = [
    "qrcode[pil]",
]

dev = [
    "pytest",
    "numdifftools",
    "black",
    "ruff",
]

[project.urls]
# PyPI renders these as sidebar links and gives several of them dedicated
# icons; only Repository and Documentation were present for 0.1.5.
Homepage = "https://nscheuer.github.io/Generalized_ADCS/"
Documentation = "https://nscheuer.github.io/Generalized_ADCS/"
Repository = "https://github.com/nscheuer/Generalized_ADCS"
Issues = "https://github.com/nscheuer/Generalized_ADCS/issues"
Changelog = "https://nscheuer.github.io/Generalized_ADCS/release_notes/index.html"

[tool.setuptools]
# The generalized-control pipeline lives with the paper it belongs to, under
# papers/Generalized_ACS/pipeline/, but is still shipped and imported as
# ADCS.pipeline. Mapping it here keeps the source layout paper-centric without
# taking the adapter out of the installed package -- the poster, the landing
# page and the Colab notebook all depend on `pip install generalized-adcs`
# providing it.
package-dir = { "" = ".", "ADCS.pipeline" = "papers/Generalized_ACS/pipeline" }

# Explicit rather than `packages.find`, because find cannot discover
# ADCS.pipeline -- it is not under ADCS/ -- and setuptools will not merge a
# find directive with an extra entry. testing/test_packaging.py asserts this
# list still matches what is on disk, so adding a subpackage and forgetting to
# list it here fails CI instead of silently shipping a broken wheel.
packages = [
    "ADCS",
    "ADCS.CONOPS",
    "ADCS.CONOPS.goallist",
    "ADCS.CONOPS.goals",
    "ADCS.CONOPS.goals.attitude_goals",
    "ADCS.CONOPS.goals.vector_goals",
    "ADCS.controller",
    "ADCS.controller.helpers",
    "ADCS.controller.neo_planner",
    "ADCS.controller.plan_and_track",
    "ADCS.controller.saltro",
    "ADCS.environment",
    "ADCS.estimators",
    "ADCS.estimators.attitude_estimators",
    "ADCS.estimators.old_attitude_estimators",
    "ADCS.estimators.estimator_helpers",
    "ADCS.estimators.orbit_estimators",
    "ADCS.flight_software",
    "ADCS.flight_software.single_core",
    "ADCS.flight_software.tasks",
    "ADCS.helpers",
    "ADCS.helpers.plot",
    "ADCS.helpers.plot.control",
    "ADCS.helpers.plot.orbit",
    "ADCS.helpers.plot.sensors",
    "ADCS.helpers.plot.states",
    "ADCS.helpers.plotting",
    "ADCS.helpers.plotting_mc",
    "ADCS.helpers.save_and_load",
    "ADCS.mc",
    "ADCS.orbits",
    "ADCS.orbits.helpers",
    "ADCS.remote",
    "ADCS.satellite_factory",
    "ADCS.satellite_factory.actuators",
    "ADCS.satellite_factory.satellites",
    "ADCS.satellite_factory.sensors",
    "ADCS.satellite_hardware",
    "ADCS.satellite_hardware.actuators",
    "ADCS.satellite_hardware.disturbances",
    "ADCS.satellite_hardware.disturbances.helpers",
    "ADCS.satellite_hardware.errors",
    "ADCS.satellite_hardware.errors.helpers",
    "ADCS.satellite_hardware.satellite",
    "ADCS.satellite_hardware.sensors",
    "ADCS.pipeline",
    "ADCS.pipeline.allocation",
    "ADCS.pipeline.compensation",
    "ADCS.pipeline.control_law",
    "ADCS.pipeline.goal_formulation",
]

# Without this, setuptools ships ONLY .py files: the 0.1.5 wheel contained no
# data files at all, so the Earth textures were missing and the orbit
# animation silently lost its texture.
#
# de421.bsp (16 MB) is deliberately NOT shipped -- Ephemeris() downloads it on
# first use, and a 16 MB payload on every install is a poor trade for a file
# most users never touch. Pass `Ephemeris(filepath=...)` to point at an
# existing copy.
# py.typed marks the package as PEP 561 typed, so downstream type checkers use
# our annotations instead of discarding them. Only safe now that the public
# signatures are correct -- see the 0.1.9 release note.
[tool.setuptools.package-data]
"*" = ["textures/*.jpg"]
"ADCS" = ["py.typed"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--tb=short",
    "--durations=15",
    "--durations-min=0.1",
    "--junitxml=testing/artifacts/pytest.xml",
]
junit_family = "xunit2"
