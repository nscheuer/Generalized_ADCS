[package]
name = "adcs-omni-rust-magnetic-field"
version = "0.1.0"
edition = "2021"

[lib]
name = "_magnetic_field_model"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python-extension = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.20" }
numpy = { version = "0.20", features = ["nalgebra"] }

