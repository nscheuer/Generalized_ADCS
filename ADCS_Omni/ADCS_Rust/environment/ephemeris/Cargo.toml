[package]
name = "adcs-omni-rust-ephemeris"
version = "0.1.0"
edition = "2021"

[lib]
name = "_ephemeris"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = { version = "0.20", features = ["nalgebra"] }
once_cell = "1"
