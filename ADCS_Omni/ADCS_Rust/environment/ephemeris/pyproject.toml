[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "adcs-omni-rust-ephemeris"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "../../../../"
module-name = "ADCS_Omni.ADCS_Rust.environment.ephemeris._ephemeris"
include = [{ path = "de421/de421.bsp", format = ["sdist", "wheel"] }]
