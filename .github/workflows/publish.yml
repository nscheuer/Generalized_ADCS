# Publish to PyPI on a version tag, via Trusted Publishing (OIDC).
#
# Why this exists: 0.1.5 was uploaded by hand with `twine upload dist/*` from a
# working tree whose dist/ still held a stale build. The artifact that reached
# PyPI corresponded to no commit in the repository, and PyPI versions are
# immutable. This workflow builds from a clean checkout of the tag, smoke-tests
# the built wheel in an isolated environment, and only then publishes.
#
# SETUP (once, on pypi.org -> generalized-adcs -> Publishing -> Add a pending
# publisher):
#     Owner:              nscheuer
#     Repository name:    Generalized_ADCS
#     Workflow name:      publish.yml
#     Environment name:   pypi
# No API token is stored anywhere after that; GitHub mints a short-lived OIDC
# token per run, so there is no long-lived credential to leak or rotate.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:        # manual re-run without moving a tag

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # so the tag and its history are present

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          rm -rf dist build *.egg-info   # never publish a stale artifact
          python -m build

      - name: Check metadata renders on PyPI
        run: |
          python -m pip install --upgrade twine
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke-test:
    name: Install the built wheel and import it
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately does NOT check out the repo: this must exercise the wheel
      # exactly as a user receives it, with no source tree on sys.path to mask
      # a missing module or data file. This is the check that would have caught
      # 0.1.5 shipping without ADCS/helpers/cholesky_update.py.
      - name: Import from the wheel alone
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python - <<'PY'
          import ADCS, os
          print("version:", ADCS.__version__)

          # the module that 0.1.5 shipped without
          from ADCS.helpers.cholesky_update import cholupdate, choldowndate
          import numpy as np
          A = np.diag([4.0, 3.0, 2.0])
          R = np.linalg.cholesky(A).T.copy(order="C")
          x = np.array([0.3, -0.2, 0.5])
          cholupdate(R, x)
          assert np.allclose(R.T @ R, A + np.outer(x, x)), "cholupdate is wrong"

          # package data must travel with the wheel
          root = os.path.dirname(ADCS.__file__)
          for rel in ("helpers/plot/orbit/textures/2k_earth_daymap.jpg",
                      "helpers/plotting/textures/2k_earth_daymap.jpg"):
              assert os.path.exists(os.path.join(root, rel)), f"missing data file: {rel}"

          # the legacy estimator that used to need choldate
          from ADCS.estimators.old_attitude_estimators.attitude_SRUAKF import SRUAKF

          # PEP 561 marker must travel with the wheel, or downstream type
          # checkers silently discard every annotation we ship
          assert os.path.exists(os.path.join(root, "py.typed")), "py.typed missing"

          # ADCS.pipeline is mapped in from papers/Generalized_ACS via
          # package-dir, which setuptools' package discovery cannot see. A
          # mistake there ships a wheel with ZERO pipeline files and no build
          # error -- it has happened once already. Fail here, with a clear
          # message, before the snippet run below fails obscurely.
          n_pipeline = sum(len([f for f in fs if f.endswith(".py")])
                           for _, _, fs in os.walk(os.path.join(root, "pipeline")))
          assert n_pipeline > 0, (
              "the wheel contains no ADCS/pipeline modules -- check "
              "[tool.setuptools] package-dir and the explicit packages list")
          print(f"pipeline modules in wheel: {n_pipeline}")
          print("wheel smoke test: OK")
          PY

      # The poster prints code, and a printed poster cannot be revised.
      # verify_snippets.py holds every printed block verbatim and executes it,
      # so it is the contract between the poster and the package. Run it
      # against the WHEEL -- testing/test_poster_snippets.py already runs it
      # against the source tree on every PR, but only this exercises what a
      # user who types the poster's `pip install` line actually receives.
      - uses: actions/checkout@v4
        with:
          path: _src
          sparse-checkout: papers/SSC26_poster

      - name: Poster snippets must run against the wheel
        run: |
          mkdir -p "$RUNNER_TEMP/snippets"
          cp _src/papers/SSC26_poster/verify_snippets.py "$RUNNER_TEMP/snippets/"
          cd "$RUNNER_TEMP/snippets"
          python - <<'PY'
          # The script prepends its own parent-of-parent to sys.path so it can
          # run from a checkout. Copied here that resolves to a scratch
          # directory containing no ADCS, so the wheel wins -- but assert it
          # rather than trust it, or this silently degrades into testing the
          # source tree again.
          import runpy, ADCS
          assert "site-packages" in ADCS.__file__, f"not the wheel: {ADCS.__file__}"
          print(f"exercising {ADCS.__file__} (version {ADCS.__version__})")
          runpy.run_path("verify_snippets.py", run_name="__main__")
          PY

      # Our annotations become authoritative for users the moment py.typed
      # ships, so a wrong signature turns into a false error in THEIR code.
      # Type-check a representative program against the installed wheel.
      - name: Type-check a user program against the wheel
        run: |
          python -m pip install mypy
          cd "$(mktemp -d)"
          cat > user_code.py <<'PY'
          import numpy as np
          import ADCS
          from ADCS.satellite_hardware.satellite import EstimatedSatellite

          acts: list[ADCS.Actuator] = [
              ADCS.RW(axis=np.array([1, 0, 0]), max_torque=0.0023,
                      J=5.7e-6, h=0.0, h_max=0.0036)
          ]
          acts += [ADCS.MTQ(axis, max_torque=0.2) for axis in np.eye(3)]
          sens = [ADCS.MTM(axis) for axis in np.eye(3)]
          satellite = ADCS.Satellite(mass=10, J_0=np.diag([0.03, 0.03, 0.01]),
                                     actuators=acts, sensors=sens,
                                     boresight=np.array([0, 0, 1]))
          est = EstimatedSatellite.from_satellite(satellite)
          ctrl = ADCS.controller.MTQ_w_RW_LP(est_sat=est, p_gain=5e-5, d_gain=2e-3,
                                             c_gain=1e-3, h_target=np.zeros(3))
          gyro = ADCS.Gyro(axis=np.array([1.0, 0, 0]), bias=None, noise=None)
          PY
          mypy user_code.py --ignore-missing-imports

  publish:
    name: Publish to PyPI
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: pypi          # attach approval/branch rules here if wanted
    permissions:
      id-token: write          # required for Trusted Publishing; no token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Emits PEP 740 provenance attestations by default, so users can verify
      # the artifact was built by this workflow from this repository.
      - uses: pypa/gh-action-pypi-publish@release/v1
