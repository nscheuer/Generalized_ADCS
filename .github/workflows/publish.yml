# Publish to PyPI on a version tag, via Trusted Publishing (OIDC).

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # so the tag and its history are present

      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          rm -rf dist build *.egg-info   # never publish a stale artifact
          python -m build

      - name: Check metadata renders on PyPI
        run: |
          python -m pip install --upgrade twine
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke-test:
    name: Install and import the built wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import GenADCS from the wheel
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python -c "import GenADCS; print(GenADCS.__file__)"

  publish:
    name: Publish to PyPI
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: pypi          # attach approval/branch rules here if wanted
    permissions:
      id-token: write          # required for Trusted Publishing; no token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Emits PEP 740 provenance attestations by default, so users can verify
      # the artifact was built by this workflow from this repository.
      - uses: pypa/gh-action-pypi-publish@release/v1
