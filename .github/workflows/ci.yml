name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: ./.github/workflows/ci-cpp.yml
    with:
      runner: ${{ matrix.os }}

  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: ./.github/workflows/ci-rust.yml
    with:
      runner: ${{ matrix.os }}

  python:
    name: Python / ${{ matrix.os }}
    needs: [cpp, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: ./.github/workflows/ci-python.yml
    with:
      runner: ${{ matrix.os }}

  integration:
    name: Bindings and cross-backend / ${{ matrix.os }}
    needs: [cpp, rust, python]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: ./.github/workflows/ci-integration.yml
    with:
      runner: ${{ matrix.os }}
