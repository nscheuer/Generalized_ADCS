# .github/workflows/ci.yml

name: Run Pytest on All Branches

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  check_all_pytests:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ Create and Activate Virtual Environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
          
      - name: 📦 Install Dependencies
        run: |
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install git+https://github.com/jcrudy/choldate.git --no-build-isolation
          pip uninstall -y cmake

      - name: 🧰 Install system dependencies (C++)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            libarmadillo-dev \
            libboost-math-dev

      - name: 🛠️ Build trajectory_planner
        run: |
          source .venv/bin/activate
          cd trajectory_planner
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE=$(which python) \
            -DPYTHON_EXECUTABLE=$(which python)
          make -j$(nproc)
          
      - name: 🧪 Run Pytest
        run: |
          source .venv/bin/activate
          mkdir -p testing/artifacts
          pytest \
            -m "not vslow" \
            --durations=0 \
            --durations-min=0.0 \
            --junitxml=testing/artifacts/pytest.xml

      - name: 📦 Upload Pytest JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-report
          path: testing/artifacts/pytest.xml

      - name: 📋 Publish Test Summary
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: testing/artifacts/pytest.xml
