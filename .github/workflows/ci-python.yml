name: Python backend

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ inputs.runner }}
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUMBA_CACHE_DIR }}
          key: ${{ runner.os }}-py312-numba-${{ hashFiles('GenADCS/backends/python/**/*.py', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py312-numba-
      - name: Build Python package
        shell: bash
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install -e '.[dev]'
      - name: Test Python backend
        shell: bash
        run: python -m pytest GenADCS/tests/backends/python -n auto --dist loadfile
