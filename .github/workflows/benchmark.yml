name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  benchmarks:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ Create and Activate Virtual Environment
        run: |
          python -m venv .venv
          source .venv/bin/activate

      - name: 📦 Install Dependencies
        run: |
          source .venv/bin/activate
          pip install -r requirements.txt
          pip uninstall -y cmake

      - name: ⏱️ Run Benchmarks
        id: benchmarks
        continue-on-error: true
        run: |
          source .venv/bin/activate
          shopt -s nullglob
          scripts=(testing/benchmarks/benchmark_*.py)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No benchmark scripts found."
            exit 1
          fi

          status=0
          for script in "${scripts[@]}"; do
            if [ "$(basename "$script")" = "report_benchmarks.py" ]; then
              continue
            fi

            echo "::group::$(basename "$script")"
            python "$script" --compare
            code=$?
            echo "::endgroup::"

            if [ $code -ne 0 ]; then
              status=$code
            fi
          done

          exit $status

      - name: 📊 Generate Benchmark Report
        if: always()
        run: |
          source .venv/bin/activate
          python testing/benchmarks/report_benchmarks.py \
            --from-artifacts \
            --no-show \
            --plot testing/artifacts/benchmarks/benchmark_multipliers.png \
            --markdown testing/artifacts/benchmarks/pr_comment.md \
            --summary-json testing/artifacts/benchmarks/benchmark_summary.json

      - name: 💬 Comment Benchmark Report
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- generalized-adcs-benchmark-report -->';
            const body = fs.readFileSync('testing/artifacts/benchmarks/pr_comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: 📝 Benchmark Step Summary
        if: always()
        run: |
          cat testing/artifacts/benchmarks/pr_comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📈 Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: testing/artifacts/benchmarks/

      - name: 🚦 Fail On Benchmark Regression
        if: always() && steps.benchmarks.outcome == 'failure'
        run: exit 1
