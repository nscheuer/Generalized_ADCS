# .github/workflows/docs.yml
name: Build and Deploy Sphinx Docs
on:
  push:
    branches: [ main ]
  # Runs on every PR regardless of base -- see the note in ci.yml.
  # Deployment stays gated on main by the `if:` on the deploy step.
  pull_request:
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install project with documentation extras
      run: |
        pip install --upgrade pip
        pip install -e ".[docs]"
        
    - name: Build HTML documentation
      run: |
        sphinx-multiversion docs/source _build/html
        python3 docs/build_historical_versions.py _build/html
        touch _build/html/.nojekyll
        printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0;url=main/"><a href="main/">Current documentation</a>' > _build/html/index.html
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: _build/html
