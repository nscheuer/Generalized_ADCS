[package]
name="adcs-omni-rust-simulate"
version="0.1.0"
edition="2021"
[lib]
name="_simulate"
path="lib.rs"
crate-type=["cdylib","rlib"]
[dependencies]
pyo3={version="0.20",features=["extension-module"]}

[workspace]
resolver = "2"
members = [
    "bias", "config", "dynamics", "environment/atmosphere",
    "environment/ephemeris", "environment/gravity",
    "environment/magnetic_field_model", "environment/planetary_body",
    "hardware/ADCS_subsystem", "hardware/satellite",
    "hardware/satellite_geometry", "helpers/math", "helpers/math/frames",
    "propagation/coupled_propagators", "solver", "state",
]
default-members = [
    "config", "dynamics", "hardware/ADCS_subsystem",
    "hardware/satellite_geometry", "helpers/math", "helpers/math/frames", "state",
    "environment/atmosphere", "environment/ephemeris", "environment/gravity",
    "environment/magnetic_field_model",
]
