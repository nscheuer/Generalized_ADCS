[package]
name = "adcs-omni-rust-bias"
version = "0.1.0"
edition = "2021"

[lib]
name = "_bias"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["auto-initialize"] }
philox_native = { package = "adcs-omni-rust-random", path = "../helpers/random", default-features = false }

[features]
python-extension = ["pyo3/extension-module"]
