[package]
name = "adcs-omni-rust-dynamics"
version = "0.1.0"
edition = "2021"

[lib]
name = "_dynamics"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["auto-initialize"] }
numpy = { version = "0.20", features = ["nalgebra"] }

[features]
python-extension = ["pyo3/extension-module"]
