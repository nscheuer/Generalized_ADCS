[package]
name = "adcs-omni-rust-coupled-propagators"
version = "0.1.0"
edition = "2021"
[lib]
name = "_coupled"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]
[features]
default = []
python-extension = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.20" }
numpy = { version = "0.20", features = ["nalgebra"] }
atmosphere_native = { package = "adcs-omni-rust-atmosphere", path = "../../environment/atmosphere", default-features = false }
ephemeris_native = { package = "adcs-omni-rust-ephemeris", path = "../../environment/ephemeris", default-features = false }
magnetic_native = { package = "adcs-omni-rust-magnetic-field", path = "../../environment/magnetic_field_model", default-features = false }
gravity_native = { package = "adcs-omni-rust-gravity", path = "../../environment/gravity", default-features = false }
