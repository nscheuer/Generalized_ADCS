[package]
name = "adcs-omni-rust-adcs-subsystem"
version = "0.1.0"
edition = "2021"

[lib]
name = "_subsystem"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["auto-initialize"] }
nalgebra = "0.32"
numpy = { version = "0.20", features = ["nalgebra"] }
philox_native = { package = "adcs-omni-rust-random", path = "../../helpers/random", default-features = false }
math_native = { package = "adcs-omni-rust-math", path = "../../helpers/math" }
frames_native = { package = "adcs-omni-rust-frames", path = "../../helpers/math/frames" }
ephemeris_native = { package = "adcs-omni-rust-ephemeris", path = "../../environment/ephemeris", default-features = false }

[features]
python-extension = ["pyo3/extension-module"]
