[package]
name = "adcs-omni-rust-obc-subsystem"
version = "0.1.0"
edition = "2021"

[lib]
name = "_obc_subsystem"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["auto-initialize"] }
nalgebra = "0.32"
frames_native = { package = "adcs-omni-rust-frames", path = "../../helpers/math/frames" }
adcs_subsystem = { package = "adcs-omni-rust-adcs-subsystem", path = "../ADCS_subsystem" }

[features]
python-extension = ["pyo3/extension-module"]
