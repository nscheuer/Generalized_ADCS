[package]
name = "adcs-omni-rust-ephemeris"
version = "0.1.0"
edition = "2021"

[lib]
name = "_ephemeris"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python-extension = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.20" }
numpy = { version = "0.20", features = ["nalgebra"] }
once_cell = "1"

[dev-dependencies]
pyo3 = { version = "0.20", features = ["auto-initialize"] }
