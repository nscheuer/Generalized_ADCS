[package]
name = "adcs-omni-rust-atmosphere"
version = "0.1.0"
edition = "2021"

[lib]
name = "_atmosphere"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python-extension = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.20" }
nrlmsise00 = { version = "0.2", default-features = false }
magnetic_native = { package = "adcs-omni-rust-magnetic-field", path = "../magnetic_field_model", default-features = false }

[dev-dependencies]
pyo3 = { version = "0.20", features = ["auto-initialize"] }
